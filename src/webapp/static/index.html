<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Научный клубок — Harmonic Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --ink: #f2f2f0;
    --muted: #8b8b92;
    --line: rgba(255,255,255,0.10);
    --line-soft: rgba(255,255,255,0.06);
    --accent: #3b82f6;
    --accent-soft: rgba(59,130,246,0.12);
    --card: #131317;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 400;
  }
  .mono { font-family: 'Space Mono', monospace; }

  canvas#grid { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 56px 24px 90px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  header { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
  }
  .eyebrow::before, .eyebrow::after { content: ''; width: 22px; height: 1px; background: var(--accent); opacity: 0.5; }
  h1 {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 34px;
    margin: 0; letter-spacing: -0.01em;
  }
  .stats { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; justify-content: center; }
  .stat-chip {
    font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(6px);
    font-variant-numeric: tabular-nums;
  }
  .stat-chip b { color: var(--ink); font-weight: 700; }

  .search-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px;
    display: flex;
    gap: 4px;
    box-shadow: 0 12px 40px -18px rgba(0,0,0,0.55);
  }
  .search-card:focus-within { border-color: var(--accent); }
  #q {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--ink); font-size: 15px; padding: 15px 14px;
    font-family: 'Space Grotesk', sans-serif;
  }
  #q::placeholder { color: #55555c; }
  #ask-btn {
    background: var(--ink); color: var(--bg); border: none; border-radius: 3px;
    padding: 0 26px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    font-family: 'Space Mono', monospace; font-weight: 700; cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  #ask-btn:hover { background: var(--accent); }
  #ask-btn:active { transform: scale(0.98); }
  #ask-btn:disabled { opacity: 0.4; cursor: default; }

  .examples { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .example-chip {
    font-family: 'Space Mono', monospace; font-size: 11.5px; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; cursor: pointer; transition: all 0.15s ease;
  }
  .example-chip:hover { color: var(--accent); border-color: var(--accent); }

  .loading {
    display: none; align-items: center; gap: 10px; color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 12px; padding: 4px;
  }
  .loading.show { display: flex; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  #result { display: none; flex-direction: column; gap: 18px; }
  #result.show { display: flex; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 26px;
  }
  .answer-meta {
    display: flex; gap: 16px; flex-wrap: wrap; font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--muted); margin-bottom: 16px; padding-bottom: 16px;
    border-bottom: 1px dashed var(--line);
  }
  .answer-meta span b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .answer-text { font-size: 15px; line-height: 1.7; color: #e4e4e2; }
  .answer-text p { margin: 0 0 12px; }
  .answer-text ul, .answer-text ol { margin: 0 0 12px; padding-left: 22px; }
  .answer-text li { margin: 4px 0; }
  .answer-text strong { color: #fff; font-weight: 600; }
  .answer-text code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; font-family: 'Space Mono', monospace; font-size: 0.9em; }
  .answer-text hr { border: none; border-top: 1px dashed var(--line); margin: 14px 0; }
  .answer-text h1, .answer-text h2, .answer-text h3 { font-family: 'Syne', sans-serif; margin: 16px 0 8px; color: #fff; }
  .answer-text .table-wrap { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 6px; }
  .answer-text table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .answer-text th, .answer-text td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  .answer-text th { font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: rgba(255,255,255,0.03); }
  .answer-text tr:last-child td { border-bottom: none; }

  .panel-title {
    font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--muted); margin: 0 0 12px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .panel-title small { font-weight: 400; text-transform: none; letter-spacing: 0; color: #55555c; }

  #graph-card canvas {
    width: 100%; height: 340px; display: block; border-radius: 3px;
    background: linear-gradient(180deg, #0e0e12, #0a0a0d);
    cursor: grab;
  }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; }

  .sources { display: flex; flex-direction: column; gap: 8px; }
  .source-pill {
    display: inline-flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace;
    font-size: 11.5px; color: var(--muted); background: var(--card); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 10px; margin: 2px 4px 2px 0;
  }
  .source-pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }

  .empty-note { color: var(--muted); font-size: 14px; padding: 10px 2px; }

  footer {
    text-align: center; color: var(--muted); font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 0.04em; padding-top: 10px;
  }
</style>
</head>
<body>
<canvas id="grid"></canvas>

<div class="wrap">
  <header>
    <div class="eyebrow">Harmonic Labs · Норникель AI Hack</div>
    <h1>Карта знаний R&amp;D</h1>
    <div class="stats" id="stats"><span class="stat-chip mono">загрузка графа…</span></div>
  </header>

  <div class="search-card">
    <input id="q" type="text" placeholder="Спроси про материалы, процессы, оборудование…" autofocus />
    <button id="ask-btn">Спросить</button>
  </div>

  <div class="examples" id="examples"></div>

  <div class="loading" id="loading">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span>Harmonic ищет по графу, модель собирает ответ…</span>
  </div>

  <div id="result">
    <div class="card" id="answer-card"></div>

    <div class="card" id="graph-card">
      <div class="panel-title">Карта связей<small id="graph-count"></small></div>
      <canvas id="graph-canvas"></canvas>
      <div class="legend" id="legend"></div>
    </div>

    <div class="sources" id="sources-block"></div>
  </div>

  <footer>HARMONIC LABS — SSM-АРХИТЕКТУРА + ГРАФ ЗНАНИЙ · MVP</footer>
</div>

<script>
const EXAMPLES = [
  "Какие методы обессоливания воды подходят для обогатительной фабрики?",
  "Что известно про медь, золото и серебро?",
  "Какие технические решения циркуляции электролита описаны?",
  "Какое оборудование используется при флотации?",
];
const examplesEl = document.getElementById("examples");
EXAMPLES.forEach(ex => {
  const chip = document.createElement("div");
  chip.className = "example-chip";
  chip.textContent = ex;
  chip.onclick = () => { document.getElementById("q").value = ex; ask(); };
  examplesEl.appendChild(chip);
});

async function loadStats() {
  try {
    const r = await fetch("/api/stats");
    const d = await r.json();
    const typeChips = Object.entries(d.by_type).sort((a,b) => b[1]-a[1])
      .map(([k,v]) => `<span class="stat-chip mono">${k}: <b>${v}</b></span>`).join("");
    document.getElementById("stats").innerHTML = `
      <span class="stat-chip mono">узлов: <b>${d.nodes}</b></span>
      <span class="stat-chip mono">связей: <b>${d.edges}</b></span>${typeChips}`;
  } catch (e) {
    document.getElementById("stats").innerHTML = `<span class="stat-chip mono">граф недоступен</span>`;
  }
}
loadStats();

const btn = document.getElementById("ask-btn");
const input = document.getElementById("q");
const loading = document.getElementById("loading");
const result = document.getElementById("result");
const answerCard = document.getElementById("answer-card");
const sourcesBlock = document.getElementById("sources-block");

input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
btn.addEventListener("click", ask);

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  btn.disabled = true;
  loading.classList.add("show");
  result.classList.remove("show");
  stopGraph();

  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const d = await r.json();
    render(d);
  } catch (e) {
    answerCard.innerHTML = `<div class="empty-note">Ошибка запроса: ${e}</div>`;
    document.getElementById("graph-card").style.display = "none";
    sourcesBlock.innerHTML = "";
    result.classList.add("show");
  } finally {
    loading.classList.remove("show");
    btn.disabled = false;
  }
}

function render(d) {
  const graphCard = document.getElementById("graph-card");
  if (!d.answer) {
    answerCard.innerHTML = `<div class="empty-note">${d.reason || "Ничего не найдено."}</div>`;
    graphCard.style.display = "none";
    sourcesBlock.innerHTML = "";
    result.classList.add("show");
    return;
  }
  answerCard.innerHTML = `
    <div class="answer-meta">
      <span>узлов-затравок: <b>${d.seeds.length}</b></span>
      <span>подграф: <b>${d.subgraph_nodes}</b> узлов / <b>${d.subgraph_edges}</b> связей</span>
      <span>источников: <b>${d.sources.length}</b></span>
      <span>retrieval: <b>${d.retrieval || "?"}</b></span>
    </div>
    <div class="answer-text"></div>`;
  answerCard.querySelector(".answer-text").innerHTML = mdToHtml(d.answer);

  if (d.sources && d.sources.length) {
    sourcesBlock.innerHTML = `<h3 class="panel-title">Источники</h3>` +
      d.sources.map(s => `<span class="source-pill">${s}</span>`).join("");
  } else {
    sourcesBlock.innerHTML = "";
  }

  // display выставляем ДО startGraph(): canvas меряет getBoundingClientRect()
  // родителя, а пока #result со скрытым display:none -- размер всегда 0
  graphCard.style.display = (d.graph && d.graph.nodes.length) ? "block" : "none";
  result.classList.add("show");

  if (d.graph && d.graph.nodes.length) {
    document.getElementById("graph-count").textContent =
      `${d.graph.nodes.length} узлов показано из ${d.subgraph_nodes}`;
    startGraph(d.graph);
  }
}

// ══════════════ мини-markdown -> html, без внешних зависимостей ══════════════
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function mdInline(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
  return s;
}
function isTableRow(line) {
  return /^\|.*\|$/.test(line.trim());
}
function isTableSep(line) {
  return /^\|?[\s:|-]+\|?$/.test(line.trim()) && line.includes("-");
}
function splitRow(line) {
  const t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
  return t.split("|").map(c => c.trim());
}
function tableToHtml(rows) {
  const [head, ...body] = rows;
  let html = "<table><thead><tr>" +
    head.map(c => `<th>${mdInline(c)}</th>`).join("") + "</tr></thead><tbody>";
  for (const r of body) {
    html += "<tr>" + r.map(c => `<td>${mdInline(c)}</td>`).join("") + "</tr>";
  }
  return html + "</tbody></table>";
}

function mdToHtml(text) {
  const lines = text.split("\n");
  let html = "", inList = null;
  const closeList = () => { if (inList) { html += `</${inList}>`; inList = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) { closeList(); continue; }

    if (isTableRow(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      closeList();
      const tableLines = [line];
      let j = i + 2;
      while (j < lines.length && isTableRow(lines[j])) { tableLines.push(lines[j]); j++; }
      const rows = [splitRow(tableLines[0]), ...tableLines.slice(1).map(splitRow)];
      html += `<div class="table-wrap">${tableToHtml(rows)}</div>`;
      i = j - 1;
      continue;
    }

    if (/^-{3,}$|^\*{3,}$/.test(line)) { closeList(); html += "<hr>"; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { closeList(); html += `<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`; continue; }
    const ul = line.match(/^[-*]\s+(.*)/);
    if (ul) {
      if (inList !== "ul") { closeList(); html += "<ul>"; inList = "ul"; }
      html += `<li>${mdInline(ul[1])}</li>`;
      continue;
    }
    const ol = line.match(/^\d+\.\s+(.*)/);
    if (ol) {
      if (inList !== "ol") { closeList(); html += "<ol>"; inList = "ol"; }
      html += `<li>${mdInline(ol[1])}</li>`;
      continue;
    }
    closeList();
    html += `<p>${mdInline(line)}</p>`;
  }
  closeList();
  return html;
}

// ══════════════ граф связей (a-la Obsidian) ══════════════
const TYPE_COLOR = {
  Material: "#2563EB", Process: "#7c3aed", Equipment: "#059669",
  Property: "#d97706", Experiment: "#dc2626", Publication: "#64748b",
  Expert: "#db2777", Facility: "#0891b2",
};
const gcanvas = document.getElementById("graph-canvas");
const gctx = gcanvas.getContext("2d");
let gNodes = [], gEdges = [], gRAF = null, gDragging = null, gHover = null, gDPR = 1;

function resizeGraphCanvas() {
  gDPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = gcanvas.getBoundingClientRect();
  gcanvas.width = Math.ceil(r.width * gDPR);
  gcanvas.height = Math.ceil(340 * gDPR);
}

function startGraph(graph) {
  resizeGraphCanvas();
  const W = gcanvas.width, H = gcanvas.height;
  const idx = {};
  gNodes = graph.nodes.map((n, i) => {
    idx[n.id] = i;
    const ang = (i / graph.nodes.length) * Math.PI * 2;
    const r = Math.min(W, H) * 0.32;
    return {
      ...n, x: W/2 + Math.cos(ang) * r, y: H/2 + Math.sin(ang) * r,
      vx: 0, vy: 0, r: 3.2 * gDPR + Math.min(n.degree, 10) * 0.5 * gDPR,
    };
  });
  gEdges = graph.edges.map(e => ({ s: idx[e.source], t: idx[e.target], relation: e.relation }))
    .filter(e => e.s !== undefined && e.t !== undefined);

  const legend = document.getElementById("legend");
  const usedTypes = [...new Set(graph.nodes.map(n => n.type))];
  legend.innerHTML = usedTypes.map(t =>
    `<span class="legend-item"><span class="legend-dot" style="background:${TYPE_COLOR[t]||'#999'}"></span>${t}</span>`
  ).join("");

  attachDrag();
  attachHover();
  if (gRAF) cancelAnimationFrame(gRAF);
  simTick();
}

function stopGraph() {
  if (gRAF) cancelAnimationFrame(gRAF);
  gRAF = null;
}

function simTick() {
  const W = gcanvas.width, H = gcanvas.height;
  const N = gNodes.length;

  // силы: отталкивание всех от всех, притяжение по рёбрам, центрирование
  for (let i = 0; i < N; i++) {
    const a = gNodes[i];
    if (a === gDragging) continue;
    let fx = (W/2 - a.x) * 0.0006, fy = (H/2 - a.y) * 0.0006;
    for (let j = 0; j < N; j++) {
      if (i === j) continue;
      const b = gNodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = Math.max(dx*dx + dy*dy, 4);
      const f = (4600 * gDPR * gDPR) / d2;
      fx += dx / Math.sqrt(d2) * f;
      fy += dy / Math.sqrt(d2) * f;
    }
    a.vx = (a.vx + fx) * 0.82;
    a.vy = (a.vy + fy) * 0.82;
  }
  for (const e of gEdges) {
    const a = gNodes[e.s], b = gNodes[e.t];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const target = 100 * gDPR;
    const f = (dist - target) * 0.02;
    const fx = dx / dist * f, fy = dy / dist * f;
    if (a !== gDragging) { a.vx += fx; a.vy += fy; }
    if (b !== gDragging) { b.vx -= fx; b.vy -= fy; }
  }
  for (const n of gNodes) {
    if (n === gDragging) continue;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(n.r, Math.min(W - n.r, n.x));
    n.y = Math.max(n.r, Math.min(H - n.r, n.y));
  }

  gctx.clearRect(0, 0, W, H);
  gctx.strokeStyle = "rgba(255,255,255,0.14)";
  gctx.lineWidth = 1 * gDPR;
  for (const e of gEdges) {
    const a = gNodes[e.s], b = gNodes[e.t];
    gctx.beginPath(); gctx.moveTo(a.x, a.y); gctx.lineTo(b.x, b.y); gctx.stroke();
  }
  for (const n of gNodes) {
    gctx.fillStyle = TYPE_COLOR[n.type] || "#999";
    gctx.beginPath(); gctx.arc(n.x, n.y, n.r, 0, 6.2832); gctx.fill();
  }
  gctx.font = `${10 * gDPR}px 'Space Mono', monospace`;
  const topLabeled = [...gNodes].sort((a,b) => b.degree - a.degree).slice(0, 6);
  const toDraw = new Set(topLabeled);
  if (gHover) toDraw.add(gHover);
  for (const n of toDraw) {
    const label = n.label.slice(0, 26);
    const w = gctx.measureText(label).width;
    const lx = n.x + n.r + 5, ly = n.y + 3;
    gctx.fillStyle = "rgba(10,10,13,0.82)";
    gctx.fillRect(lx - 3, ly - 10 * gDPR, w + 6, 13 * gDPR);
    gctx.fillStyle = n === gHover ? "#ffffff" : "rgba(242,242,240,0.75)";
    gctx.fillText(label, lx, ly);
  }

  gRAF = requestAnimationFrame(simTick);
}

function attachDrag() {
  gcanvas.onmousedown = e => {
    const rect = gcanvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * gDPR, my = (e.clientY - rect.top) * gDPR;
    let closest = null, bestD = 400 * gDPR * gDPR;
    for (const n of gNodes) {
      const d2 = (n.x-mx)**2 + (n.y-my)**2;
      if (d2 < bestD) { bestD = d2; closest = n; }
    }
    gDragging = closest;
    gcanvas.style.cursor = closest ? "grabbing" : "grab";
  };
  window.addEventListener("mousemove", e => {
    if (!gDragging) return;
    const rect = gcanvas.getBoundingClientRect();
    gDragging.x = (e.clientX - rect.left) * gDPR;
    gDragging.y = (e.clientY - rect.top) * gDPR;
    gDragging.vx = 0; gDragging.vy = 0;
  });
  window.addEventListener("mouseup", () => { gDragging = null; gcanvas.style.cursor = "grab"; });
}

function attachHover() {
  gcanvas.addEventListener("mousemove", e => {
    if (gDragging) { gHover = null; return; }
    const rect = gcanvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * gDPR, my = (e.clientY - rect.top) * gDPR;
    let closest = null, bestD = 900 * gDPR * gDPR;
    for (const n of gNodes) {
      const d2 = (n.x-mx)**2 + (n.y-my)**2;
      if (d2 < bestD) { bestD = d2; closest = n; }
    }
    gHover = closest;
  });
  gcanvas.addEventListener("mouseleave", () => { gHover = null; });
}

// ══════════════ фон: точечная сетка с синим пульсом у курсора ══════════════
const cv = document.getElementById("grid");
const ctx = cv.getContext("2d");
let W, H, DPR, SP, OFF;
const RAD = 190;
let mx = -99999, my = -99999;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.ceil(r.width * DPR);
  cv.height = Math.ceil(r.height * DPR);
  W = cv.width; H = cv.height;
  SP = 30 * DPR; OFF = SP * 0.5;
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; });
window.addEventListener("mouseleave", () => { mx = -99999; my = -99999; });

function renderGrid(t) {
  ctx.clearRect(0, 0, W, H);
  const cols = Math.ceil(W / SP) + 1, rows = Math.ceil(H / SP) + 1;

  ctx.fillStyle = "rgb(40,40,46)";
  ctx.beginPath();
  for (let i = 0; i < cols; i++) {
    const x = i * SP + OFF;
    for (let j = 0; j < rows; j++) {
      const y = j * SP + OFF;
      ctx.moveTo(x + 1.3*DPR, y);
      ctx.arc(x, y, 1.3 * DPR, 0, 6.2832);
    }
  }
  ctx.fill();

  if (mx < -9000) return;
  const R = RAD * DPR, mxp = mx * DPR, myp = my * DPR;
  const iMin = Math.max(0, Math.floor((mxp - R - OFF) / SP));
  const iMax = Math.min(cols - 1, Math.ceil((mxp + R - OFF) / SP));
  const jMin = Math.max(0, Math.floor((myp - R - OFF) / SP));
  const jMax = Math.min(rows - 1, Math.ceil((myp + R - OFF) / SP));
  for (let i = iMin; i <= iMax; i++) {
    const x = i * SP + OFF;
    for (let j = jMin; j <= jMax; j++) {
      const y = j * SP + OFF;
      const dx = x - mxp, dy = y - myp;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d >= R) continue;
      const inf = 1 - d / R;
      const pulse = 0.18 * Math.sin(t * 2.8 - d * 0.017) * inf;
      const ti = Math.min(1, Math.pow(inf, 0.72) + pulse);
      const rr = (40 + (59 - 40) * ti) | 0;
      const gg = (40 + (130 - 40) * ti) | 0;
      const bb = (46 + (246 - 46) * ti) | 0;
      const sz = (1.3 + ti * 4.0) * DPR;
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.beginPath(); ctx.arc(x, y, sz, 0, 6.2832); ctx.fill();
    }
  }
}

function bgTick(ts) {
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    renderGrid(ts / 1000);
  }
  requestAnimationFrame(bgTick);
}
requestAnimationFrame(bgTick);
</script>
