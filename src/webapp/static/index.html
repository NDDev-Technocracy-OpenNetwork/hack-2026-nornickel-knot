<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Научный клубок — Harmonic Labs</title>
<style>
  :root {
    --ink: #0b0e14;
    --panel: #12161f;
    --panel-2: #171c27;
    --line: #232a38;
    --paper: #eef1f6;
    --muted: #7c8698;
    --copper: #c9834f;
    --copper-glow: rgba(201, 131, 79, 0.35);
    --ok: #5fb896;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #151b28 0%, var(--ink) 55%);
    color: var(--paper);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 28px;
    flex: 1;
  }

  header { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
  .eyebrow {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--copper); font-weight: 600;
  }
  h1 {
    font-size: 30px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #fff, #b9c2d1 140%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  .stat-chip {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,0.02);
  }
  .stat-chip b { color: var(--paper); font-weight: 600; }

  .search-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px;
    display: flex;
    gap: 8px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .search-card:focus-within {
    border-color: var(--copper-glow);
    box-shadow: 0 0 0 3px var(--copper-glow), 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  #q {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-size: 16px;
    padding: 14px 12px;
    font-family: inherit;
  }
  #q::placeholder { color: var(--muted); }
  #ask-btn {
    background: var(--copper);
    color: #1a0f06;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  #ask-btn:hover { filter: brightness(1.08); }
  #ask-btn:active { transform: scale(0.98); }
  #ask-btn:disabled { opacity: 0.5; cursor: default; }

  .examples { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .example-chip {
    font-size: 12.5px; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px;
    cursor: pointer; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .example-chip:hover { color: var(--paper); border-color: var(--copper-glow); }

  #result { display: none; flex-direction: column; gap: 16px; }
  #result.show { display: flex; }

  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    padding: 4px 4px;
  }
  .loading.show { display: flex; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--copper);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .answer-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
  }
  .answer-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted); margin-bottom: 14px;
    padding-bottom: 14px; border-bottom: 1px dashed var(--line);
  }
  .answer-meta span b { color: var(--ok); font-variant-numeric: tabular-nums; }
  .answer-text {
    font-size: 15px; line-height: 1.65; white-space: pre-wrap; color: #dbe0ea;
  }
  .answer-text strong { color: var(--paper); }

  .sources {
    display: flex; flex-direction: column; gap: 8px;
  }
  .sources h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin: 0 0 4px; font-weight: 600;
  }
  .source-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; margin: 2px 4px 2px 0;
  }
  .source-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--copper); flex: none; }

  .empty-note {
    color: var(--muted); font-size: 14px; padding: 16px; text-align: center;
  }

  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    padding-top: 20px; margin-top: auto;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="wrap">
  <header>
    <div class="eyebrow">Harmonic Labs · Норникель AI Hack · Научный клубок</div>
    <h1>Карта знаний R&amp;D</h1>
    <div class="stats" id="stats">
      <span class="stat-chip">загрузка графа…</span>
    </div>
  </header>

  <div class="search-card">
    <input id="q" type="text" placeholder="Спроси про материалы, процессы, оборудование…" autofocus />
    <button id="ask-btn">Спросить</button>
  </div>

  <div class="examples" id="examples"></div>

  <div class="loading" id="loading">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span>Harmonic ищет по графу, модель собирает ответ…</span>
  </div>

  <div id="result">
    <div class="answer-card" id="answer-card"></div>
    <div class="sources" id="sources-block"></div>
  </div>

  <footer>Harmonic Labs — своя SSM-архитектура + граф знаний. MVP, не продакшн.</footer>
</div>

<script>
const EXAMPLES = [
  "Какие методы обессоливания воды подходят для обогатительной фабрики?",
  "Что известно про медь, золото и серебро?",
  "Какие технические решения циркуляции электролита описаны?",
  "Какое оборудование используется при флотации?",
];

const examplesEl = document.getElementById("examples");
EXAMPLES.forEach(ex => {
  const chip = document.createElement("div");
  chip.className = "example-chip";
  chip.textContent = ex;
  chip.onclick = () => { document.getElementById("q").value = ex; ask(); };
  examplesEl.appendChild(chip);
});

async function loadStats() {
  try {
    const r = await fetch("/api/stats");
    const d = await r.json();
    const typeStr = Object.entries(d.by_type)
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `${k}: <b>${v}</b>`).join(" · ");
    document.getElementById("stats").innerHTML = `
      <span class="stat-chip">узлов: <b>${d.nodes}</b></span>
      <span class="stat-chip">связей: <b>${d.edges}</b></span>
      <span class="stat-chip">${typeStr}</span>
    `;
  } catch (e) {
    document.getElementById("stats").innerHTML = `<span class="stat-chip">граф недоступен</span>`;
  }
}
loadStats();

const btn = document.getElementById("ask-btn");
const input = document.getElementById("q");
const loading = document.getElementById("loading");
const result = document.getElementById("result");
const answerCard = document.getElementById("answer-card");
const sourcesBlock = document.getElementById("sources-block");

input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
btn.addEventListener("click", ask);

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  btn.disabled = true;
  loading.classList.add("show");
  result.classList.remove("show");

  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const d = await r.json();
    render(d);
  } catch (e) {
    answerCard.innerHTML = `<div class="empty-note">Ошибка запроса: ${e}</div>`;
    sourcesBlock.innerHTML = "";
    result.classList.add("show");
  } finally {
    loading.classList.remove("show");
    btn.disabled = false;
  }
}

function render(d) {
  if (!d.answer) {
    answerCard.innerHTML = `<div class="empty-note">${d.reason || "Ничего не найдено."}</div>`;
    sourcesBlock.innerHTML = "";
    result.classList.add("show");
    return;
  }
  answerCard.innerHTML = `
    <div class="answer-meta">
      <span>узлов-затравок: <b>${d.seeds.length}</b></span>
      <span>подграф: <b>${d.subgraph_nodes}</b> узлов / <b>${d.subgraph_edges}</b> связей</span>
      <span>источников: <b>${d.sources.length}</b></span>
    </div>
    <div class="answer-text"></div>
  `;
  answerCard.querySelector(".answer-text").textContent = d.answer;

  if (d.sources && d.sources.length) {
    sourcesBlock.innerHTML = `<h3>Источники</h3>` +
      d.sources.map(s => `<span class="source-pill">${s}</span>`).join("");
  } else {
    sourcesBlock.innerHTML = "";
  }
  result.classList.add("show");
}

// фоновый холст: тихая сетка узлов-связей, намёк на граф знаний
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let W, H, nodes = [];
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const N = Math.min(46, Math.floor((W * H) / 42000));
for (let i = 0; i < N; i++) {
  nodes.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15,
  });
}

function frame() {
  ctx.clearRect(0, 0, W, H);
  for (const n of nodes) {
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > W) n.vx *= -1;
    if (n.y < 0 || n.y > H) n.vy *= -1;
  }
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const dist = Math.hypot(dx, dy);
      if (dist < 160) {
        ctx.strokeStyle = `rgba(201,131,79,${0.10 * (1 - dist / 160)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }
  for (const n of nodes) {
    ctx.fillStyle = "rgba(238,241,246,0.35)";
    ctx.beginPath();
    ctx.arc(n.x, n.y, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  frame();
} else {
  ctx.clearRect(0, 0, W, H);
}
</script>
</body>
</html>
