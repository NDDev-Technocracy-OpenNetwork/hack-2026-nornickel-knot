name: ci

# CI for rldyourmnd/hack-2026-nornickel-knot (public OSS, Python/uv).
# Project: harmonic-labs (pyproject.toml + uv.lock).
# Triggers: pull_request + workflow_dispatch ONLY (no push: cross-owner reusable).
# Reusable workflows are pinned to an immutable ci-workflows SHA.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (3.13)
    permissions:
      contents: read
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/python-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      uv_version: "0.12.23"
      python_version: '3.13'
      install_command: 'uv sync --frozen'
      test_command: 'uv run python -m compileall -q src'
