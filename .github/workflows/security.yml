name: security

# Full public-OSS security suite for rldyourmnd/hack-2026-nornickel-knot.
# Public repo -> GitHub Actions minutes (ubuntu-latest) + free code scanning.
# Triggers: pull_request + workflow_dispatch ONLY (no push: cross-owner reusable).
# Reusable workflows are pinned to an immutable ci-workflows SHA.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/public-codeql.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      languages: '["python","actions"]'

  scorecard:
    name: OSSF Scorecard
    if: github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/public-scorecard.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/public-dependency-review.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      fail_on_severity: moderate

  zizmor:
    name: zizmor (SARIF)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/zizmor-sarif.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  secret-scan:
    name: Gitleaks secret scan
    permissions:
      contents: read
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/secret-scan.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/actionlint.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  semgrep:
    name: semgrep
    permissions:
      contents: read
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/semgrep-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
